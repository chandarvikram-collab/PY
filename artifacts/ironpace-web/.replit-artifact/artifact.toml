kind = "web"
previewPath = "/ironpace-web/"
title = "IronPace Web"
description = "A web dashboard for IronPace athletes to view their fitness stats (calories, macros, workouts, streaks) and quickly log food, workouts, and runs from a desktop browser."
version = "1.0.0"
id = "artifacts/ironpace-web"
router = "path"

[[services]]
name = "web"
paths = [ "/ironpace-web/" ]
localPort = 26161

[services.development]
run = "pnpm --filter @workspace/ironpace-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ironpace-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/ironpace-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26161"
BASE_PATH = "/ironpace-web/"
