kind = "web"
previewPath = "/ironpace-web/"
title = "IronPace Web"
description = "A web dashboard for IronPace fitness — shows weekly workout schedule, calorie and macro progress, activity streaks, active challenges, and a leaderboard. Designed in a crisp red-and-white bento-grid style for athletes who want a glanceable overview of their training week."
version = "1.0.0"
id = "artifacts/ironpace-web"
router = "path"

[[services]]
name = "web"
paths = [ "/ironpace-web/" ]
localPort = 26161

[services.development]
run = "pnpm --filter @workspace/ironpace-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ironpace-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/ironpace-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26161"
BASE_PATH = "/ironpace-web/"
